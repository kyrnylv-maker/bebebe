<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Web Clone (bebebe production)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --tg-bg-tg: #0e1621;
            --tg-bg-sidebar: #17212b;
            --tg-bg-chat: #182533;
            --tg-bg-active: #2b394a;
            --tg-color-accent: #5288c1;
            --tg-color-text: #f5f5f5;
            --tg-color-muted: #7f91a4;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-bg-tg);
            color: var(--tg-color-text);
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #2b394a; border-radius: 10px; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col antialiased">

    <div id="auth-screen" class="flex flex-col items-center justify-center flex-1 p-4 bg-[#0e1621]">
        <div class="w-full max-w-md bg-[#17212b] p-8 rounded-2xl shadow-xl border border-[#24313f]">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-[#5288c1] rounded-full flex items-center justify-center mx-auto mb-4 text-white text-3xl shadow-lg">
                    <i class="fa-solid fa-paper-plane"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">Вход в Bebebe Мессенджер</h2>
                <p class="text-sm text-[#7f91a4]">Подключение к новому бэкенду на Railway</p>
            </div>

            <form id="auth-form" class="space-y-4" onsubmit="event.preventDefault();">
                <div>
                    <label class="block text-xs font-semibold text-[#7f91a4] uppercase mb-1">Юзернейм</label>
                    <div class="relative">
                        <span class="absolute left-3 top-2.5 text-[#7f91a4]">@</span>
                        <input type="text" id="auth-username" required class="w-full pl-8 pr-3 py-2 bg-[#101720] border border-[#24313f] rounded-lg text-white focus:outline-none focus:border-[#5288c1]">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[#7f91a4] uppercase mb-1">Пароль</label>
                    <input type="password" id="auth-password" required class="w-full px-3 py-2 bg-[#101720] border border-[#24313f] rounded-lg text-white focus:outline-none focus:border-[#5288c1]" placeholder="••••••••">
                </div>
                
                <div class="flex gap-3 pt-2">
                    <button type="button" id="btn-login" class="flex-1 py-2.5 bg-[#5288c1] hover:bg-[#4374a8] text-white font-medium rounded-lg transition-all active:scale-95">Войти</button>
                    <button type="button" id="btn-register" class="flex-1 py-2.5 bg-[#202b36] hover:bg-[#2b394a] text-[#5288c1] border border-[#24313f] font-medium rounded-lg transition-all active:scale-95">Регистрация</button>
                </div>
            </form>
        </div>
    </div>

    <div id="app-screen" class="hidden flex h-full w-full overflow-hidden bg-[#0e1621]">
        
        <aside id="sidebar" class="w-full md:w-[380px] h-full bg-[#17212b] border-r border-[#101720] flex flex-col shrink-0 z-10">
            <div class="p-3 flex items-center gap-3">
                <button id="profile-menu-btn" class="text-[#7f91a4] hover:text-white p-2 rounded-full hover:bg-[#202b36]">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-xs text-[#7f91a4]"></i>
                    <input type="text" id="search-input" placeholder="Поиск контактов или каналов..." class="w-full pl-9 pr-3 py-1.5 bg-[#101720] border border-transparent rounded-xl text-sm text-white placeholder-[#7f91a4] focus:outline-none focus:border-[#5288c1]">
                </div>
                <button id="create-channel-btn" onclick="App.createChannelPrompt()" class="text-[#5288c1] hover:bg-[#202b36] p-2 rounded-full" title="Создать канал">
                    <i class="fa-solid fa-circle-plus text-lg"></i>
                </button>
            </div>

            <div class="flex px-2 border-b border-[#101720] text-sm text-center font-medium">
                <button onclick="App.switchTab('all')" id="tab-all" class="flex-1 py-2.5 text-[#5288c1] border-b-2 border-[#5288c1]">Все</button>
                <button onclick="App.switchTab('chats')" id="tab-chats" class="flex-1 py-2.5 text-[#7f91a4]">Чаты</button>
                <button onclick="App.switchTab('channels')" id="tab-channels" class="flex-1 py-2.5 text-[#7f91a4]">Каналы</button>
            </div>

            <div id="chat-list" class="flex-1 overflow-y-auto divide-y divide-[#101720]/30"></div>
        </aside>

        <main id="chat-window" class="hidden md:flex flex-1 flex-col h-full bg-[#182533] relative">
            <div id="chat-blank-state" class="absolute inset-0 flex flex-col items-center justify-center bg-[#0e1621] z-0">
                <span class="px-3 py-1.5 rounded-full bg-[#17212b] text-[#7f91a4] text-xs shadow-inner">Выберите чат из списка слева</span>
            </div>

            <div id="chat-active-state" class="flex flex-col h-full w-full z-10 hidden">
                <header class="h-[60px] bg-[#17212b] px-4 flex items-center justify-between border-b border-[#101720] shrink-0">
                    <div class="flex items-center gap-3">
                        <button onclick="App.closeChatMobile()" class="md:hidden text-[#7f91a4] hover:text-white mr-1">
                            <i class="fa-solid fa-arrow-left text-lg"></i>
                        </button>
                        <div id="chat-avatar" class="w-10 h-10 rounded-full bg-[#5288c1] text-white flex items-center justify-center font-bold text-sm shadow-md"></div>
                        <div>
                            <h3 id="chat-title" class="font-bold text-sm text-white"></h3>
                            <p id="chat-status" class="text-xs text-[#5288c1]">онлайн</p>
                        </div>
                    </div>
                </header>

                <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3 bg-[radial-gradient(#24313f_1px,transparent_1px)] [background-size:16px_16px]"></div>

                <footer class="p-3 bg-[#17212b] border-t border-[#101720] shrink-0">
                    <form id="message-form" class="flex items-center gap-2">
                        <input type="text" id="message-input" autocomplete="off" placeholder="Напишите сообщение..." class="flex-1 py-2 px-4 bg-[#101720] border border-transparent rounded-xl text-sm text-white focus:outline-none focus:border-[#5288c1]">
                        <button type="submit" class="p-2.5 bg-[#5288c1] hover:bg-[#4374a8] text-white rounded-full active:scale-95 transition-transform">
                            <i class="fa-solid fa-paper-plane text-sm"></i>
                        </button>
                    </form>
                </footer>
            </div>
        </main>
    </div>

    <div id="profile-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
        <div class="w-full max-w-sm bg-[#17212b] rounded-2xl border border-[#24313f] overflow-hidden shadow-2xl">
            <div class="p-4 bg-[#202b36] flex justify-between items-center border-b border-[#101720]">
                <h3 class="font-bold text-white">Настройки профиля</h3>
                <button onclick="App.toggleProfileModal(false)" class="text-[#7f91a4] hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 flex flex-col items-center gap-4">
                <div id="profile-avatar-display" class="w-24 h-24 bg-[#5288c1] text-3xl font-bold rounded-full flex items-center justify-center shadow-md border-2 border-[#24313f]"></div>
                <div class="w-full space-y-3">
                    <div>
                        <label class="block text-[11px] font-bold text-[#7f91a4] uppercase mb-1">О себе (Bio)</label>
                        <textarea id="profile-bio" rows="2" class="w-full px-3 py-2 bg-[#101720] border border-[#24313f] rounded-lg text-sm text-white focus:outline-none focus:border-[#5288c1]" placeholder="Расскажите о себе..."></textarea>
                    </div>
                    <button onclick="App.saveProfileSettings()" class="w-full py-2 bg-[#5288c1] hover:bg-[#4374a8] text-white font-medium rounded-lg text-sm transition-colors shadow-md">Сохранить</button>
                    <button onclick="App.logout()" class="w-full py-2 bg-rose-900/40 hover:bg-rose-900 text-rose-300 font-medium rounded-lg text-sm transition-colors">Выйти из аккаунта</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // АКТУАЛЬНЫЕ ЭНДПОИНТЫ ДЛЯ ПОДКЛЮЧЕНИЯ К RAILWAY
        const CONFIG = {
            API_URL: "https://bebebe-production-ac07.up.railway.app",
            WS_URL: "wss://bebebe-production-ac07.up.railway.app"
        };

        const STATE = {
            token: localStorage.getItem('tg_token') || null,
            currentUser: JSON.parse(localStorage.getItem('tg_user')) || null,
            activeChat: null,
            currentTab: 'all',
            chats: []
        };

        const API = {
            async request(endpoint, options = {}) {
                const url = `${CONFIG.API_URL}${endpoint}`;
                const headers = { 'Content-Type': 'application/json', ...options.headers };
                if (STATE.token) {
                    headers['Authorization'] = `Bearer ${STATE.token}`;
                }

                try {
                    const response = await fetch(url, { ...options, headers });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.detail || `HTTP Error ${response.status}`);
                    return data;
                } catch (err) {
                    console.error(`Ошибка выполнения API запроса к ${endpoint}:`, err);
                    alert(`Ошибка: ${err.message}`);
                    throw err;
                }
            },

            login(username, password) {
                return this.request('/api/login', { method: 'POST', body: JSON.stringify({ username, password }) });
            },

            register(username, password) {
                return this.request('/api/register', { method: 'POST', body: JSON.stringify({ username, password }) });
            },

            getChats() {
                return this.request('/api/chats');
            },

            getMessages(chatId) {
                return this.request(`/api/chats/${chatId}/messages`);
            },

            updateProfile(bio) {
                return this.request('/api/profile/update', { method: 'POST', body: JSON.stringify({ bio }) });
            },

            createChannel(title) {
                return this.request('/api/channels/create', { method: 'POST', body: JSON.stringify({ title }) });
            }
        };

        const WS = {
            socket: null,
            reconnectTimer: null,

            connect() {
                if (!STATE.token) return;
                if (this.socket) this.socket.close();

                const wsUri = `${CONFIG.WS_URL}/ws?token=${STATE.token}`;
                this.socket = new WebSocket(wsUri);

                this.socket.onopen = () => {
                    console.log("✅ WebSocket подключен к хосту bebebe");
                    clearTimeout(this.reconnectTimer);
                };

                this.socket.onmessage = (event) => {
                    try {
                        const packet = JSON.parse(event.data);
                        this.handleIncomingPacket(packet);
                    } catch (e) {
                        console.error("Критическая ошибка обработки WebSocket пакета:", e);
                    }
                };

                this.socket.onerror = (err) => {
                    console.error("Ошибка WebSocket канала:", err);
                };

                this.socket.onclose = () => {
                    console.warn("⚠️ Восстановление соединения через 3 секунды...");
                    this.reconnectTimer = setTimeout(() => this.connect(), 3000);
                };
            },

            send(payload) {
                if (this.socket && this.socket.readyState === WebSocket.OPEN) {
                    this.socket.send(JSON.stringify(payload));
                } else {
                    console.error("Ошибка отправки: WebSocket отключен");
                }
            },

            handleIncomingPacket(packet) {
                if (packet.event === 'new_message') {
                    if (STATE.activeChat && Number(STATE.activeChat.id) === Number(packet.chat_id)) {
                        App.renderMessage(packet.sender, packet.text);
                    }
                    
                    const targetChat = STATE.chats.find(c => Number(c.id) === Number(packet.chat_id));
                    if (targetChat) {
                        targetChat.last_msg = `${packet.sender}: ${packet.text}`;
                        App.renderChatList();
                    }
                }
            }
        };

        const App = {
            init() {
                this.bindEvents();
                
                if (STATE.token && STATE.currentUser) {
                    this.showScreen('app');
                    WS.connect();
                    this.loadChatsFromServer();
                } else {
                    this.showScreen('auth');
                }
            },

            bindEvents() {
                document.getElementById('btn-login').addEventListener('click', () => this.processAuth('login'));
                document.getElementById('btn-register').addEventListener('click', () => this.processAuth('register'));
                document.getElementById('profile-menu-btn').addEventListener('click', () => this.toggleProfileModal(true));
                
                document.getElementById('message-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleSendMessage();
                });
            },

            showScreen(screen) {
                if (screen === 'auth') {
                    document.getElementById('auth-screen').classList.remove('hidden');
                    document.getElementById('app-screen').classList.add('hidden');
                } else {
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('app-screen').classList.remove('hidden');
                }
            },

            async processAuth(type) {
                const usernameInput = document.getElementById('auth-username').value.trim();
                const passwordInput = document.getElementById('auth-password').value;

                if (!usernameInput || !passwordInput) return alert("Заполните поля!");

                try {
                    const res = type === 'login' 
                        ? await API.login(usernameInput, passwordInput)
                        : await API.register(usernameInput, passwordInput);

                    STATE.token = res.token;
                    STATE.currentUser = res.user;
                    localStorage.setItem('tg_token', res.token);
                    localStorage.setItem('tg_user', JSON.stringify(res.user));

                    this.showScreen('app');
                    WS.connect();
                    this.loadChatsFromServer();
                } catch (e) {}
            },

            async loadChatsFromServer() {
                try {
                    STATE.chats = await API.getChats();
                    this.renderChatList();
                } catch (e) {
                    console.error("Не удалось загрузить диалоги", e);
                }
            },

            switchTab(tab) {
                STATE.currentTab = tab;
                ['all', 'chats', 'channels'].forEach(t => {
                    const el = document.getElementById(`tab-${t}`);
                    if (t === tab) {
                        el.className = "flex-1 py-2.5 text-[#5288c1] border-b-2 border-[#5288c1] font-medium";
                    } else {
                        el.className = "flex-1 py-2.5 text-[#7f91a4] hover:text-white transition-all";
                    }
                });
                this.renderChatList();
            },

            renderChatList() {
                const container = document.getElementById('chat-list');
                container.innerHTML = '';

                const filtered = STATE.chats.filter(c => STATE.currentTab === 'all' || c.type === STATE.currentTab);

                if (filtered.length === 0) {
                    container.innerHTML = `<div class="p-8 text-center text-xs text-[#7f91a4]">Списков чатов пуст</div>`;
                    return;
                }

                filtered.forEach(chat => {
                    const isSelected = STATE.activeChat && Number(STATE.activeChat.id) === Number(chat.id);
                    const item = document.createElement('div');
                    item.className = `p-3 flex items-center gap-3 cursor-pointer transition-colors ${isSelected ? 'bg-[#2b394a]' : 'hover:bg-[#202b36]'}`;
                    item.onclick = () => this.selectActiveChat(chat);

                    item.innerHTML = `
                        <div class="w-11 h-11 rounded-full bg-[#5288c1] text-white flex items-center justify-center font-bold shadow-sm shrink-0 uppercase">
                            ${chat.title ? chat.title[0] : '?'}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between mb-0.5">
                                <h4 class="font-bold text-sm text-white truncate">${chat.title}</h4>
                            </div>
                            <p class="text-xs text-[#7f91a4] truncate">${chat.last_msg || 'Нет сообщений'}</p>
                        </div>
                    `;
                    container.appendChild(item);
                });
            },

            async selectActiveChat(chat) {
                STATE.activeChat = chat;
                this.renderChatList();

                document.getElementById('chat-blank-state').classList.add('hidden');
                const activeState = document.getElementById('chat-active-state');
                activeState.classList.remove('hidden');

                document.getElementById('chat-title').innerText = chat.title;
                document.getElementById('chat-avatar').innerText = chat.title ? chat.title[0].toUpperCase() : '?';
                document.getElementById('chat-status').innerText = chat.type === 'channels' ? 'канал' : 'онлайн';

                document.getElementById('sidebar').classList.add('hidden', 'md:flex');
                document.getElementById('chat-window').classList.remove('hidden');

                const msgContainer = document.getElementById('messages-container');
                msgContainer.innerHTML = `<div class="text-center text-xs text-[#7f91a4] py-2">Загрузка истории сообщений...</div>`;

                try {
                    const history = await API.getMessages(chat.id);
                    msgContainer.innerHTML = '';
                    
                    if(history.length === 0) {
                        msgContainer.innerHTML = `<div class="text-center text-xs text-[#7f91a4] py-4">Здесь пока нет сообщений.</div>`;
                    } else {
                        history.forEach(msg => this.renderMessage(msg.sender, msg.text));
                    }
                } catch (e) {
                    msgContainer.innerHTML = `<div class="text-center text-xs text-rose-400 py-4">Не удалось загрузить историю</div>`;
                }
            },

            handleSendMessage() {
                const input = document.getElementById('message-input');
                const text = input.value.trim();
                if (!text || !STATE.activeChat) return;

                if (STATE.activeChat.type === 'channels' && !STATE.activeChat.is_admin) {
                    alert("В каналах отправлять сообщения могут только администраторы!");
                    return;
                }

                const outgoingPayload = {
                    action: "send_message",
                    chat_id: STATE.activeChat.id,
                    text: text
                };

                WS.send(outgoingPayload);
                this.renderMessage(STATE.currentUser.username, text);
                
                STATE.activeChat.last_msg = `${STATE.currentUser.username}: ${text}`;
                this.renderChatList();

                input.value = '';
                input.focus();
            },

            renderMessage(sender, text) {
                const container = document.getElementById('messages-container');
                const msgWrap = document.createElement('div');
                const isMe = sender === STATE.currentUser?.username;
                
                msgWrap.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                msgWrap.innerHTML = `
                    <div class="max-w-[75%] min-w-[80px] p-2.5 rounded-2xl shadow-md relative ${isMe ? 'bg-[#2b394a] text-white rounded-tr-none' : 'bg-[#17212b] text-white rounded-tl-none'}">
                        ${!isMe ? `<p class="text-[11px] text-[#5288c1] font-bold mb-0.5">@${sender}</p>` : ''}
                        <p class="text-sm leading-relaxed break-words">${this.escapeHTML(text)}</p>
                    </div>
                `;

                container.appendChild(msgWrap);
                container.scrollTop = container.scrollHeight;
            },

            async createChannelPrompt() {
                const title = prompt("Введите название нового канала:");
                if (!title || !title.trim()) return;

                try {
                    await API.createChannel(title.trim());
                    await this.loadChatsFromServer();
                } catch(e) {
                    console.error("Ошибка при создании канала", e);
                }
            },

            closeChatMobile() {
                document.getElementById('sidebar').classList.remove('hidden');
                document.getElementById('chat-window').classList.add('hidden');
                STATE.activeChat = null;
            },

            toggleProfileModal(show) {
                const modal = document.getElementById('profile-modal');
                if (show) {
                    modal.classList.remove('hidden');
                    document.getElementById('profile-bio').value = STATE.currentUser?.bio || '';
                    document.getElementById('profile-avatar-display').innerText = STATE.currentUser?.username ? STATE.currentUser.username[0].toUpperCase() : 'U';
                } else {
                    modal.classList.add('hidden');
                }
            },

            async saveProfileSettings() {
                const bio = document.getElementById('profile-bio').value.trim();
                try {
                    await API.updateProfile(bio);
                    STATE.currentUser.bio = bio;
                    localStorage.setItem('tg_user', JSON.stringify(STATE.currentUser));
                    this.toggleProfileModal(false);
                    alert("Профиль успешно сохранен!");
                } catch (e) {
                    console.error("Не удалось обновить профиль", e);
                }
            },

            logout() {
                localStorage.clear();
                STATE.token = null;
                STATE.currentUser = null;
                STATE.activeChat = null;
                if(WS.socket) WS.socket.close();
                this.showScreen('auth');
                this.toggleProfileModal(false);
            },

            escapeHTML(str) {
                return str.replace(/[&<>'"]/g, 
                    tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
                );
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>

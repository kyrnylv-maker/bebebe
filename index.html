<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Web Clone</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Кастомные Telegram-переменные для тонкой настройки */
        :root {
            --tg-bg-tg: #0e1621;
            --tg-bg-sidebar: #17212b;
            --tg-bg-chat: #182533;
            --tg-bg-active: #2b394a;
            --tg-color-accent: #5288c1;
            --tg-color-text: #f5f5f5;
            --tg-color-muted: #7f91a4;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-bg-tg);
            color: var(--tg-color-text);
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: #2b394a;
            border-radius: 10px;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col antialiased">

    <div id="auth-screen" class="flex flex-col items-center justify-center flex-1 p-4 bg-[#0e1621]">
        <div class="w-full max-w-md bg-[#17212b] p-8 rounded-2xl shadow-xl border border-[#24313f]">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-[#5288c1] rounded-full flex items-center justify-center mx-auto mb-4 text-white text-3xl shadow-lg">
                    <i class="fa-solid fa-paper-plane animate-pulse"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">Вход в Pipipupu Мессенджер</h2>
                <p class="text-sm text-[#7f91a4]">Введите данные для авторизации или создания аккаунта</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-[#7f91a4] uppercase mb-1">Username</label>
                    <div class="relative">
                        <span class="absolute left-3 top-2.5 text-[#7f91a4]">@</span>
                        <input type="text" id="auth-username" required class="w-full pl-8 pr-3 py-2 bg-[#101720] border border-[#24313f] rounded-lg text-white focus:outline-none focus:border-[#5288c1] transition-colors" placeholder="username">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[#7f91a4] uppercase mb-1">Пароль</label>
                    <input type="password" id="auth-password" required class="w-full px-3 py-2 bg-[#101720] border border-[#24313f] rounded-lg text-white focus:outline-none focus:border-[#5288c1] transition-colors" placeholder="••••••••">
                </div>
                
                <div class="flex gap-3 pt-2">
                    <button type="button" id="btn-login" class="flex-1 py-2.5 bg-[#5288c1] hover:bg-[#4374a8] text-white font-medium rounded-lg transition-all shadow-md active:scale-95">Войти</button>
                    <button type="button" id="btn-register" class="flex-1 py-2.5 bg-[#202b36] hover:bg-[#2b394a] text-[#5288c1] border border-[#24313f] font-medium rounded-lg transition-all active:scale-95">Регистрация</button>
                </div>
            </form>
        </div>
    </div>

    <div id="app-screen" class="hidden flex h-full w-full overflow-hidden bg-[#0e1621]">
        
        <aside id="sidebar" class="w-full md:w-[380px] h-full bg-[#17212b] border-r border-[#101720] flex flex-col shrink-0 z-10">
            <div class="p-3 flex items-center gap-3">
                <button id="profile-menu-btn" class="text-[#7f91a4] hover:text-white p-2 rounded-full hover:bg-[#202b36] transition-colors">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-xs text-[#7f91a4]"></i>
                    <input type="text" id="search-input" placeholder="Поиск контактов или каналов..." class="w-full pl-9 pr-3 py-1.5 bg-[#101720] border border-transparent rounded-xl text-sm text-white placeholder-[#7f91a4] focus:outline-none focus:border-[#5288c1]">
                </div>
                <button id="create-channel-btn" class="text-[#5288c1] hover:bg-[#202b36] p-2 rounded-full transition-colors" title="Создать канал">
                    <i class="fa-solid fa-circle-plus text-lg"></i>
                </button>
            </div>

            <div class="flex px-2 border-b border-[#101720] text-sm text-center font-medium">
                <button onclick="App.switchTab('all')" id="tab-all" class="flex-1 py-2.5 text-[#5288c1] border-b-2 border-[#5288c1] transition-all">Все</button>
                <button onclick="App.switchTab('chats')" id="tab-chats" class="flex-1 py-2.5 text-[#7f91a4] hover:text-white transition-all">Чаты</button>
                <button onclick="App.switchTab('channels')" id="tab-channels" class="flex-1 py-2.5 text-[#7f91a4] hover:text-white transition-all">Каналы</button>
            </div>

            <div id="chat-list" class="flex-1 overflow-y-auto divide-y divide-[#101720]/30">
                <div class="p-8 text-center text-xs text-[#7f91a4]">Нет доступных чатов</div>
            </div>
        </aside>

        <main id="chat-window" class="hidden md:flex flex-1 flex-col h-full bg-[#182533] relative">
            
            <div id="chat-blank-state" class="absolute inset-0 flex flex-col items-center justify-center bg-[#0e1621] z-0">
                <span class="px-3 py-1.5 rounded-full bg-[#17212b] text-[#7f91a4] text-xs shadow-inner">Выберите, кому хотели бы написать</span>
            </div>

            <div id="chat-active-state" class="flex flex-col h-full w-full z-10 opacity-0 transition-opacity duration-200">
                <header class="h-[60px] bg-[#17212b] px-4 flex items-center justify-between border-b border-[#101720] shrink-0">
                    <div class="flex items-center gap-3">
                        <button onclick="App.closeChatMobile()" class="md:hidden text-[#7f91a4] hover:text-white mr-1">
                            <i class="fa-solid fa-arrow-left text-lg"></i>
                        </button>
                        <div id="chat-avatar" class="w-10 h-10 rounded-full bg-[#5288c1] text-white flex items-center justify-center font-bold text-sm shadow-md">?</div>
                        <div>
                            <h3 id="chat-title" class="font-bold text-sm text-white">Название чата</h3>
                            <p id="chat-status" class="text-xs text-[#5288c1]">онлайн</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="Calls.startCall('audio')" class="p-2.5 text-[#7f91a4] hover:text-[#5288c1] rounded-full hover:bg-[#202b36] transition-all" title="Аудиозвонок">
                            <i class="fa-solid fa-phone text-base"></i>
                        </button>
                        <button onclick="Calls.startCall('video')" class="p-2.5 text-[#7f91a4] hover:text-[#5288c1] rounded-full hover:bg-[#202b36] transition-all" title="Видеозвонок">
                            <i class="fa-solid fa-video text-base"></i>
                        </button>
                    </div>
                </header>

                <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3 bg-[radial-gradient(#24313f_1px,transparent_1px)] [background-size:16px_16px]">
                    </div>

                <footer class="p-3 bg-[#17212b] border-t border-[#101720] flex flex-col gap-2 shrink-0">
                    <div id="file-preview-zone" class="hidden flex items-center justify-between bg-[#101720] p-2 rounded-lg text-xs">
                        <div class="flex items-center gap-2 text-[#7f91a4]">
                            <i class="fa-solid fa-file-arrow-up text-[#5288c1] text-sm animate-bounce"></i>
                            <span id="file-preview-name" class="text-white truncate max-w-[200px]">file.jpg</span>
                            <span id="file-progress-bar" class="text-[10px] text-[#5288c1] font-mono">(0%)</span>
                        </div>
                        <button onclick="App.clearAttachedFile()" class="text-rose-400 hover:text-rose-500"><i class="fa-solid fa-xmark"></i></button>
                    </div>

                    <form id="message-form" class="flex items-center gap-2">
                        <label class="cursor-pointer p-2.5 text-[#7f91a4] hover:text-white rounded-full hover:bg-[#202b36] transition-colors shrink-0">
                            <input type="file" id="media-input" class="hidden" onchange="App.handleFileSelect(event)">
                            <i class="fa-solid fa-paperclip text-lg"></i>
                        </label>
                        
                        <div class="relative shrink-0">
                            <button type="button" onclick="App.toggleEmojiPicker()" class="p-2.5 text-[#7f91a4] hover:text-white rounded-full hover:bg-[#202b36] transition-colors">
                                <i class="fa-solid fa-face-smile text-lg"></i>
                            </button>
                            <div id="emoji-picker" class="hidden absolute bottom-12 left-0 bg-[#17212b] border border-[#24313f] p-2 rounded-xl grid grid-cols-5 gap-1 shadow-2xl z-50 w-44">
                                <span onclick="App.injectEmoji('😀')" class="cursor-pointer text-xl p-1 hover:bg-[#202b36] rounded text-center">😀</span>
                                <span onclick="App.injectEmoji('😂')" class="cursor-pointer text-xl p-1 hover:bg-[#202b36] rounded text-center">😂</span>
                                <span onclick="App.injectEmoji('🔥')" class="cursor-pointer text-xl p-1 hover:bg-[#202b36] rounded text-center">🔥</span>
                                <span onclick="App.injectEmoji('👍')" class="cursor-pointer text-xl p-1 hover:bg-[#202b36] rounded text-center">👍</span>
                                <span onclick="App.injectEmoji('❤️')" class="cursor-pointer text-xl p-1 hover:bg-[#202b36] rounded text-center">❤️</span>
                            </div>
                        </div>

                        <input type="text" id="message-input" autocomplete="off" placeholder="Напишите сообщение..." class="flex-1 py-2 px-4 bg-[#101720] border border-transparent rounded-xl text-sm text-white placeholder-[#7f91a4] focus:outline-none focus:border-[#5288c1]">
                        
                        <button type="submit" class="p-2.5 bg-[#5288c1] hover:bg-[#4374a8] text-white rounded-full transition-all shadow-md shrink-0 active:scale-95">
                            <i class="fa-solid fa-paper-plane text-sm"></i>
                        </button>
                    </form>
                </footer>
            </div>
        </main>
    </div>

    <div id="profile-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 backdrop-blur-xs">
        <div class="w-full max-w-sm bg-[#17212b] rounded-2xl border border-[#24313f] overflow-hidden shadow-2xl">
            <div class="p-4 bg-[#202b36] flex justify-between items-center border-b border-[#101720]">
                <h3 class="font-bold text-white">Настройки профиля</h3>
                <button onclick="App.toggleProfileModal(false)" class="text-[#7f91a4] hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 flex flex-col items-center gap-4">
                <div class="relative group cursor-pointer">
                    <div id="profile-avatar-display" class="w-24 h-24 bg-[#5288c1] text-3xl font-bold rounded-full flex items-center justify-center shadow-md border-2 border-[#24313f] overflow-hidden">U</div>
                    <label class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer text-xs text-white">
                        <input type="file" id="avatar-input" class="hidden" onchange="App.handleAvatarUpload(event)">
                        Изменить
                    </label>
                </div>
                <div class="w-full space-y-3">
                    <div>
                        <label class="block text-[11px] font-bold text-[#7f91a4] uppercase mb-1">О себе (Bio)</label>
                        <textarea id="profile-bio" rows="2" class="w-full px-3 py-2 bg-[#101720] border border-[#24313f] rounded-lg text-sm text-white focus:outline-none focus:border-[#5288c1]" placeholder="Расскажите о себе..."></textarea>
                    </div>
                    <button onclick="App.saveProfileSettings()" class="w-full py-2 bg-[#5288c1] hover:bg-[#4374a8] text-white font-medium rounded-lg text-sm transition-colors shadow-md">Сохранить изменения</button>
                </div>
            </div>
        </div>
    </div>

    <div id="call-overlay" class="hidden fixed inset-0 bg-[#0e1621]/95 flex flex-col items-center justify-between p-8 z-50 animate-fade-in">
        <div class="text-center mt-12">
            <div id="call-user-avatar" class="w-28 h-28 bg-[#5288c1] text-4xl text-white font-bold rounded-full flex items-center justify-center mx-auto mb-4 shadow-2xl border-4 border-[#24313f]">?</div>
            <h2 id="call-user-name" class="text-2xl font-bold text-white mb-1">Собеседник</h2>
            <p id="call-status-text" class="text-[#5288c1] text-sm animate-pulse">Установка WebRTC соединения...</p>
        </div>

        <div id="video-streams" class="hidden w-full max-w-2xl flex-1 my-4 bg-black rounded-xl border border-[#24313f] overflow-hidden relative">
            <video id="remote-video" class="w-full h-full object-cover" autoplay playsinline></video>
            <video id="local-video" class="absolute bottom-4 right-4 w-1/4 aspect-video bg-[#17212b] rounded-lg object-cover border border-white/20" autoplay playsinline muted></video>
        </div>

        <div class="flex items-center gap-6 mb-8">
            <button onclick="Calls.toggleMute()" id="btn-toggle-mute" class="w-12 h-12 rounded-full bg-[#202b36] text-white hover:bg-[#2b394a] flex items-center justify-center transition-all">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <button onclick="Calls.endCall()" class="w-16 h-16 rounded-full bg-rose-600 text-white hover:bg-rose-700 flex items-center justify-center shadow-lg transition-all text-xl active:scale-95">
                <i class="fa-solid fa-phone-slash"></i>
            </button>
        </div>
    </div>

    <script>
        // Конфигурация эндпоинтов бэкенда на Railway
        const CONFIG = {
            API_URL: "https://pipipupu-production.up.railway.app",
            WS_URL: "wss://pipipupu-production.up.railway.app"
        };

        // Глобальный State менеджер фронтенда
        const STATE = {
            token: localStorage.getItem('tg_token') || null,
            currentUser: JSON.parse(localStorage.getItem('tg_user')) || null,
            activeChat: null,
            currentTab: 'all', // 'all' | 'chats' | 'channels'
            chats: [
                // Тестовые моковые данные для демонстрации структуры слоев UI
                { id: 1, title: "Команда Бэкенда 🚀", type: "chats", is_admin: false, last_msg: "Обновили схемы на Railway" },
                { id: 2, title: "Слив Инсайдов (Канал)", type: "channels", is_admin: true, last_msg: "Только админы могут писать сюда" }
            ],
            attachedFile: null
        };

        // ================= CLIENT FOR HTTP REST API =================
        const API = {
            async request(endpoint, options = {}) {
                const url = `${CONFIG.API_URL}${endpoint}`;
                const headers = { 'Content-Type': 'application/json', ...options.headers };
                if (STATE.token) headers['Authorization'] = `Bearer ${STATE.token}`;

                try {
                    const response = await fetch(url, { ...options, headers });
                    if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                    return await response.json();
                } catch (err) {
                    console.error(`Ошибка запроса к ${endpoint}:`, err);
                    throw err;
                }
            },
            login(username, password) {
                return this.request('/api/login', { method: 'POST', body: JSON.stringify({ username, password }) });
            },
            register(username, password) {
                return this.request('/api/register', { method: 'POST', body: JSON.stringify({ username, password }) });
            },
            updateProfile(bio, avatarBase64) {
                return this.request('/api/profile/update', { method: 'POST', body: JSON.stringify({ bio, avatar: avatarBase64 }) });
            }
        };

        // ================= REAL-TIME WEBSOCKET MANAGER =================
        const WS = {
            socket: null,
            reconnectAttempts: 0,

            connect() {
                if (!STATE.token) return;
                const wsUri = `${CONFIG.WS_URL}/ws?token=${STATE.token}`;
                this.socket = new WebSocket(wsUri);

                this.socket.onopen = () => {
                    console.log("✅ WebSocket подключен к Railway");
                    this.reconnectAttempts = 0;
                };

                this.socket.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        this.handleIncomingMessage(data);
                    } catch (e) {
                        console.error("Ошибка парсинга WS пакета", e);
                    }
                };

                this.socket.onerror = (error) => console.error("❌ Сбой сессии WebSocket:", error);

                this.socket.onclose = () => {
                    console.warn("⚠️ Соединение WebSocket разорвано. Переподключение...");
                    this.reconnectAttempts++;
                    setTimeout(() => this.connect(), Math.min(10000, this.reconnectAttempts * 2000));
                };
            },

            send(payload) {
                if (this.socket && this.socket.readyState === WebSocket.OPEN) {
                    this.socket.send(JSON.stringify(payload));
                } else {
                    console.error("Не удалось отправить сообщение: WS неактивен");
                }
            },

            handleIncomingMessage(payload) {
                // Структура обработки событий реального времени
                // Примеры: 'new_message', 'reaction_added', 'user_status'
                if (payload.type === 'message' && STATE.activeChat && payload.chat_id === STATE.activeChat.id) {
                    App.renderMessage(payload.sender, payload.text, false, payload.media, payload.reactions);
                }
            }
        };

        // ================= UI CONTROLLER / ROUTER =================
        const App = {
            init() {
                this.bindEvents();
                // Нативный роутинг на основе токена авторизации
                if (STATE.token && STATE.currentUser) {
                    this.showScreen('app');
                    WS.connect();
                    this.renderChatList();
                } else {
                    this.showScreen('auth');
                }
            },

            bindEvents() {
                // Логин/Регистрация
                document.getElementById('btn-login').addEventListener('click', () => this.handleAuth('login'));
                document.getElementById('btn-register').addEventListener('click', () => this.handleAuth('register'));
                
                // Профиль
                document.getElementById('profile-menu-btn').addEventListener('click', () => this.toggleProfileModal(true));
                
                // Отправка сообщений
                document.getElementById('message-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.sendMessage();
                });
            },

            showScreen(screen) {
                if (screen === 'auth') {
                    document.getElementById('auth-screen').classList.remove('hidden');
                    document.getElementById('app-screen').classList.add('hidden');
                } else {
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('app-screen').classList.remove('hidden');
                }
            },

            async handleAuth(type) {
                const user = document.getElementById('auth-username').value.trim();
                const pass = document.getElementById('auth-password').value;

                if (!user || !pass) return alert("Заполните поля!");

                try {
                    // Имитируем успешный ответ, если бэкенд еще на стадии развертывания
                    // Для интеграции — раскомментируйте вызовы к API блоку ниже
                    /* const res = type === 'login' ? await API.login(user, pass) : await API.register(user, pass);
                    STATE.token = res.token;
                    STATE.currentUser = res.user;
                    */
                    
                    // Mock-fallback для мгновенного тестирования UI
                    STATE.token = "mock_token_pipipupu";
                    STATE.currentUser = { username: user, bio: "Статус в коде" };
                    
                    localStorage.setItem('tg_token', STATE.token);
                    localStorage.setItem('tg_user', JSON.stringify(STATE.currentUser));
                    
                    this.showScreen('app');
                    WS.connect();
                    this.renderChatList();
                } catch (e) {
                    alert(`Ошибка авторизации (${type})`);
                }
            },

            switchTab(tab) {
                STATE.currentTab = tab;
                ['all', 'chats', 'channels'].forEach(t => {
                    const el = document.getElementById(`tab-${t}`);
                    if (t === tab) {
                        el.className = "flex-1 py-2.5 text-[#5288c1] border-b-2 border-[#5288c1] transition-all";
                    } else {
                        el.className = "flex-1 py-2.5 text-[#7f91a4] hover:text-white transition-all";
                    }
                });
                this.renderChatList();
            },

            renderChatList() {
                const container = document.getElementById('chat-list');
                container.innerHTML = '';

                // Фильтрация элементов по выбранной вкладке (Папке)
                const filtered = STATE.chats.filter(c => STATE.currentTab === 'all' || c.type === STATE.currentTab);

                if(filtered.length === 0) {
                    container.innerHTML = `<div class="p-8 text-center text-xs text-[#7f91a4]">Пусто в этой папке</div>`;
                    return;
                }

                filtered.forEach(chat => {
                    const isSelected = STATE.activeChat && STATE.activeChat.id === chat.id;
                    const item = document.createElement('div');
                    item.className = `p-3 flex items-center gap-3 cursor-pointer transition-colors ${isSelected ? 'bg-[#2b394a]' : 'hover:bg-[#202b36]'}`;
                    item.onclick = () => this.selectChat(chat);

                    item.innerHTML = `
                        <div class="w-11 h-11 rounded-full bg-[#5288c1] text-white flex items-center justify-center font-bold shadow-sm shrink-0">
                            ${chat.title[0]}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between mb-0.5">
                                <h4 class="font-bold text-sm text-white truncate">${chat.title}</h4>
                                <span class="text-[10px] text-[#7f91a4]">16:42</span>
                            </div>
                            <p class="text-xs text-[#7f91a4] truncate">${chat.last_msg}</p>
                        </div>
                    `;
                    container.appendChild(item);
                });
            },

            selectChat(chat) {
                STATE.activeChat = chat;
                this.renderChatList(); // Обновляем выделение active элемента

                document.getElementById('chat-blank-state').classList.add('hidden');
                
                const activeState = document.getElementById('chat-active-state');
                activeState.classList.remove('hidden');
                activeState.classList.add('opacity-100');

                document.getElementById('chat-title').innerText = chat.title;
                document.getElementById('chat-avatar').innerText = chat.title[0];
                document.getElementById('chat-status').innerText = chat.type === 'channels' ? 'канал' : 'онлайн';

                // Мобильный адаптив: открываем чат на весь экран на мелких дисплеях
                document.getElementById('sidebar').classList.add('hidden', 'md:flex');
                document.getElementById('chat-window').classList.remove('hidden');

                // Очищаем и заполняем дефолтными сообщениями для рендеринга слоев UI
                const container = document.getElementById('messages-container');
                container.innerHTML = '';
                
                this.renderMessage("System", `Вы вошли в ${chat.type === 'channels' ? 'канал' : 'диалог'} "${chat.title}"`, true);
                this.renderMessage("Админ", "Добро пожаловать в клон Telegram Web!", false, null, ['🔥', '👍']);
            },

            closeChatMobile() {
                document.getElementById('sidebar').classList.remove('hidden');
                document.getElementById('chat-window').classList.add('hidden');
            },

            sendMessage() {
                const input = document.getElementById('message-input');
                const text = input.value.trim();
                
                if (!text && !STATE.attachedFile) return;

                // Валидация прав: если это канал, а текущий пользователь не создатель/админ
                if (STATE.activeChat && STATE.activeChat.type === 'channels' && !STATE.activeChat.is_admin) {
                    alert("В каналах отправка сообщений разрешена только администраторам!");
                    return;
                }

                const payload = {
                    type: 'message',
                    chat_id: STATE.activeChat.id,
                    text: text,
                    media: STATE.attachedFile ? { name: STATE.attachedFile.name, size: STATE.attachedFile.size } : null
                };

                // Отправляем в реалтайм WebSocket
                WS.send(payload);

                // Рендерим локально (оптимистичный UI)
                this.renderMessage("@me", text, false, payload.media);
                
                // Сброс полей
                input.value = '';
                this.clearAttachedFile();
            },

            renderMessage(sender, text, isSystem = false, media = null, reactions = []) {
                const container = document.getElementById('messages-container');
                const msgWrap = document.createElement('div');
                
                if (isSystem) {
                    msgWrap.className = "flex justify-center my-2";
                    msgWrap.innerHTML = `<span class="bg-[#101720]/80 text-[#7f91a4] text-[11px] px-3 py-1 rounded-full text-center shadow-sm">${text}</span>`;
                } else {
                    const isMe = sender === "@me";
                    msgWrap.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} group`;
                    
                    let mediaHtml = '';
                    if (media) {
                        mediaHtml = `
                            <div class="mb-2 p-2 bg-[#101720]/40 rounded-lg border border-[#24313f] flex items-center gap-2 max-w-xs">
                                <i class="fa-solid fa-file-invoice text-xl text-[#5288c1]"></i>
                                <div class="min-w-0 flex-1">
                                    <p class="text-xs text-white truncate">${media.name}</p>
                                    <span class="text-[9px] text-[#7f91a4]">Медиавложение</span>
                                </div>
                            </div>
                        `;
                    }

                    let reactionHtml = '';
                    if (reactions && reactions.length > 0) {
                        reactionHtml = `
                            <div class="flex gap-1 mt-1.5 flex-wrap">
                                ${reactions.map(r => `<span class="bg-[#101720]/60 text-xs px-2 py-0.5 rounded-full border border-[#24313f]/40">${r}</span>`).join('')}
                            </div>
                        `;
                    }

                    msgWrap.innerHTML = `
                        <div class="max-w-[75%] min-w-[60px] p-2.5 rounded-2xl shadow-md relative ${isMe ? 'bg-[#2b394a] text-white rounded-tr-none' : 'bg-[#17212b] text-white rounded-tl-none'}">
                            ${!isMe ? `<p class="text-[11px] text-[#5288c1] font-bold mb-0.5">${sender}</p>` : ''}
                            ${mediaHtml}
                            <p class="text-sm leading-relaxed break-words">${text}</p>
                            <span class="block text-[9px] text-[#7f91a4] text-right mt-1">16:43</span>
                            
                            <div class="absolute hidden group-hover:flex items-center gap-1 bg-[#17212b] border border-[#24313f] rounded-full p-1 -top-8 ${isMe ? 'right-0' : 'left-0'} shadow-lg z-20 transition-all">
                                <span onclick="App.addReaction(this, '🔥')" class="hover:scale-125 cursor-pointer px-1 text-xs">🔥</span>
                                <span onclick="App.addReaction(this, '👍')" class="hover:scale-125 cursor-pointer px-1 text-xs">👍</span>
                                <span onclick="App.addReaction(this, '❤️')" class="hover:scale-125 cursor-pointer px-1 text-xs">❤️</span>
                            </div>
                        </div>
                        ${reactionHtml}
                    `;
                }

                container.appendChild(msgWrap);
                container.scrollTop = container.scrollHeight;
            },

            addReaction(el, emoji) {
                // Отправка реакции через WebSocket событие
                WS.send({ type: 'add_reaction', chat_id: STATE.activeChat.id, emoji: emoji });
                alert(`Добавлена реакция: ${emoji} (Событие ушло на бэкенд)`);
            },

            handleFileSelect(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                STATE.attachedFile = file;
                document.getElementById('file-preview-zone').classList.remove('hidden');
                document.getElementById('file-preview-name').innerText = file.name;

                // Имитация прогресс-бара отправки данных чанками
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 25;
                    document.getElementById('file-progress-bar').innerText = `(${progress}%)`;
                    if (progress >= 100) clearInterval(interval);
                }, 150);
            },

            clearAttachedFile() {
                STATE.attachedFile = null;
                document.getElementById('media-input').value = '';
                document.getElementById('file-preview-zone').classList.add('hidden');
            },

            toggleEmojiPicker() {
                const picker = document.getElementById('emoji-picker');
                picker.classList.toggle('hidden');
            },

            injectEmoji(emoji) {
                const input = document.getElementById('message-input');
                input.value += emoji;
                this.toggleEmojiPicker();
                input.focus();
            },

            toggleProfileModal(show) {
                const modal = document.getElementById('profile-modal');
                if (show) {
                    modal.classList.remove('hidden');
                    document.getElementById('profile-bio').value = STATE.currentUser?.bio || '';
                    document.getElementById('profile-avatar-display').innerText = STATE.currentUser?.username?.[0]?.toUpperCase() || 'U';
                } else {
                    modal.classList.add('hidden');
                }
            },

            async handleAvatarUpload(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                // Чтение изображения в Base64 для передачи по API
                const reader = new FileReader();
                reader.onloadend = () => {
                    document.getElementById('profile-avatar-display').style.backgroundImage = `url(${reader.result})`;
                    document.getElementById('profile-avatar-display').innerText = '';
                    // Сохраняем в state
                    STATE.avatarData = reader.result;
                };
                reader.readAsDataURL(file);
            },

            async saveProfileSettings() {
                const bio = document.getElementById('profile-bio').value;
                if (STATE.currentUser) {
                    STATE.currentUser.bio = bio;
                    localStorage.setItem('tg_user', JSON.stringify(STATE.currentUser));
                }
                this.toggleProfileModal(false);
                alert("Профиль локально обновлен! Настройки готовы для отправки в базу.");
            }
        };

        // ================= INTEGRATION LAYER FOR WEBRTC CALLS =================
        const Calls = {
            peerConnection: null,
            localStream: null,

            async startCall(type) {
                if(!STATE.activeChat) return;
                
                document.getElementById('call-user-name').innerText = STATE.activeChat.title;
                document.getElementById('call-user-avatar').innerText = STATE.activeChat.title[0];
                document.getElementById('call-overlay').classList.remove('hidden');

                if (type === 'video') {
                    document.getElementById('video-streams').classList.remove('hidden');
                } else {
                    document.getElementById('video-streams').classList.add('hidden');
                }

                try {
                    // Запрашиваем доступ к системным аудио/видео медиа-девайсам
                    this.localStream = await navigator.mediaDevices.getUserMedia({
                        audio: true,
                        video: type === 'video'
                    });
                    
                    const localVideoEl = document.getElementById('local-video');
                    if (localVideoEl) localVideoEl.srcObject = this.localStream;
                    
                    document.getElementById('call-status-text').innerText = "Медиа-поток захвачен. Инициализация RTCPeerConnection...";
                    
                    // Конструктор готов к связке со STUN/TURN серверами
                    this.initWebRTCPeer();
                } catch (err) {
                    console.error("Ошибка WebRTC доступа к девайсам:", err);
                    document.getElementById('call-status-text').innerText = "Ошибка доступа к микрофону/камере";
                }
            },

            initWebRTCPeer() {
                const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
                this.peerConnection = new RTCPeerConnection(rtcConfig);

                // Добавляем локальные треки в соединение
                this.localStream.getTracks().forEach(track => this.peerConnection.addTrack(track, this.localStream));

                // Слушатель для получения удаленного видео/аудио потока
                this.peerConnection.ontrack = (event) => {
                    const remoteVideoEl = document.getElementById('remote-video');
                    if (remoteVideoEl && event.streams[0]) {
                        remoteVideoEl.srcObject = event.streams[0];
                    }
                };

                // Генерация ICE кандидатов для бэкенда сигналинга (Railway WS)
                this.peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        WS.send({
                            type: 'webrtc_signal',
                            candidate: event.candidate,
                            chat_id: STATE.activeChat.id
                        });
                    }
                };

                document.getElementById('call-status-text').innerText = "Ждем ответа собеседника (Сигналинг на Railway)...";
            },

            toggleMute() {
                if (this.localStream) {
                    const audioTrack = this.localStream.getAudioTracks()[0];
                    audioTrack.enabled = !audioTrack.enabled;
                    document.getElementById('btn-toggle-mute').classList.toggle('bg-rose-500', !audioTrack.enabled);
                }
            },

            endCall() {
                if (this.localStream) {
                    this.localStream.getTracks().forEach(track => track.stop());
                }
                if (this.peerConnection) {
                    this.peerConnection.close();
                }
                document.getElementById('call-overlay').classList.add('hidden');
                document.getElementById('call-status-text').innerText = "Звонок завершен";
            }
        };

        // Запуск приложения при полной загрузке DOM дерева
        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
